:root {
  --bg: #e7ecee;
  --surface: #f7f9fa;
  --surface-2: #dbe3e7;
  --ink: #111a20;
  --ink-2: #46555d;
  --line: #c2cdd2;
  --panel: #2b3d47;
  --panel-ink: #eaf1f3;
  --panel-ink-2: #a9bcc5;
  --accent: #1c4e9c;
  --accent-ink: #ffffff;
  --accent-soft: #dbe5f5;
  --red: #b3141f;
  --red-bg: #f8e3e4;
  --amber: #9a6200;
  --amber-bg: #f6ead2;
  --green: #17763f;
  --green-bg: #dcefe3;
  --on-color: #ffffff;
  --shadow: 0 1px 2px rgba(17, 26, 32, .08), 0 4px 14px rgba(17, 26, 32, .06);
  --f-display: "HerosCn", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --nav-h: 60px;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1215; --surface: #141c21; --surface-2: #1c2730; --ink: #e1e8eb; --ink-2: #98a9b1; --line: #29373f;
    --panel: #18252d; --panel-ink: #e1e8eb; --panel-ink-2: #8fa3ad;
    --accent: #82a9f4; --accent-ink: #0a1220; --accent-soft: #1b2a44;
    --red: #ff6d6d; --red-bg: #3a1a1d; --amber: #f0b13a; --amber-bg: #372a11; --green: #4ccf86; --green-bg: #13301f; --on-color: #0b1216;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1215; --surface: #141c21; --surface-2: #1c2730; --ink: #e1e8eb; --ink-2: #98a9b1; --line: #29373f;
  --panel: #18252d; --panel-ink: #e1e8eb; --panel-ink-2: #8fa3ad;
  --accent: #82a9f4; --accent-ink: #0a1220; --accent-soft: #1b2a44;
  --red: #ff6d6d; --red-bg: #3a1a1d; --amber: #f0b13a; --amber-bg: #372a11; --green: #4ccf86; --green-bg: #13301f; --on-color: #0b1216;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
.num, .tnum { font-variant-numeric: tabular-nums; }

/* ---------- App bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--panel); color: var(--panel-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { display: flex; align-items: center; gap: 12px; height: 54px; max-width: 1200px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: inherit; min-width: 0; }
.brand b { font-family: var(--f-display); font-size: 24px; letter-spacing: .02em; }
.brand .reg { font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .1em; border: 1.5px solid var(--panel-ink-2); color: var(--panel-ink); padding: 0 5px; border-radius: 3px; transform: translateY(-2px); }
.brand small { font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--panel-ink-2); white-space: nowrap; }
.bar .grow { flex: 1; }
.searchbox { position: relative; flex: 0 1 320px; min-width: 0; }
.searchbox input {
  width: 100%; height: 36px; border-radius: 8px; border: 1px solid transparent; padding: 0 12px 0 34px;
  background: rgba(255,255,255,.1); color: var(--panel-ink); font: 15px var(--f-body);
}
.searchbox input::placeholder { color: var(--panel-ink-2); }
.searchbox input:focus { outline: none; border-color: var(--panel-ink-2); background: rgba(255,255,255,.16); }
.searchbox svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; stroke: var(--panel-ink-2); }
.iconbtn { display: inline-grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 8px; background: transparent; color: var(--panel-ink); cursor: pointer; flex: 0 0 auto; }
.iconbtn:hover { background: rgba(255,255,255,.1); }
.iconbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.only-phone { display: none; }
.searchview { display: none; }
@media (max-width: 640px) { .brand small { display: none; } .bar .searchbox { display: none; } .only-phone { display: inline-grid; } .searchview { display: block; } }
.searchview input { width: 100%; height: 48px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 14px; font: 17px var(--f-body); margin-bottom: 4px; }
.searchview input:focus { outline: none; border-color: var(--accent); }

/* ---------- Shell ---------- */
.shell { display: flex; max-width: 1200px; margin: 0 auto; }
main {
  flex: 1; min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.view { max-width: 760px; margin: 0 auto; }
.view.wide { max-width: 980px; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: grid; grid-template-columns: repeat(5, 1fr);
}
nav.tabs a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--nav-h);
  text-decoration: none; color: var(--ink-2); font: 600 11px/1 var(--f-body); letter-spacing: .02em;
}
nav.tabs a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs a[aria-current="page"] { color: var(--accent); }
@media (min-width: 960px) {
  nav.tabs {
    position: sticky; top: calc(54px + env(safe-area-inset-top, 0px)); align-self: flex-start;
    display: flex; flex-direction: column; gap: 2px; width: 196px; height: calc(100vh - 54px);
    border-top: 0; border-right: 1px solid var(--line); background: transparent; padding: 20px 12px;
  }
  nav.tabs a { flex-direction: row; justify-content: flex-start; gap: 10px; height: 42px; padding: 0 12px; border-radius: 8px; font-size: 15px; }
  nav.tabs a[aria-current="page"] { background: var(--accent-soft); }
  main { padding-block: 28px 48px; }
}

/* ---------- Common blocks ---------- */
.eyebrow { font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px; }
.page-h { font-size: clamp(28px, 6vw, 38px); letter-spacing: .01em; margin-bottom: 6px; }
.lede { color: var(--ink-2); margin: 0 0 20px; max-width: 60ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 15px var(--f-body); cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .45; cursor: default; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
  padding: 7px 13px; font: 600 14px var(--f-body); cursor: pointer; min-height: 36px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
@media (max-width: 640px) { .chips.scrollx { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; } .chips.scrollx::-webkit-scrollbar { display: none; } .chips.scrollx .chip { flex: 0 0 auto; } }
.chip .ct { font-weight: 500; opacity: .7; margin-left: 4px; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; color: var(--ink-2); }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--green); border-radius: 3px; }

/* ---------- Home ---------- */
.home-hero { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 760px) { .home-hero { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.home-hero h1 { font-size: clamp(34px, 8vw, 52px); letter-spacing: .01em; line-height: 1; }
.home-hero h1 span { display: block; font-size: .42em; letter-spacing: .14em; color: var(--ink-2); margin-top: 8px; text-transform: uppercase; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 20px 0; }
.stats > div { background: var(--surface); padding: 12px 14px; }
.stats b { display: block; font-family: var(--f-display); font-size: 28px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--ink-2); }
.quick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; }
@media (min-width: 560px) { .quick { grid-template-columns: repeat(4, 1fr); } }
.quick a {
  display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 92px; padding: 12px 14px;
  text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
}
.quick a:hover { border-color: var(--ink-2); }
.quick a b { font-family: var(--f-display); font-size: 19px; line-height: 1.1; }
.quick a span { font-size: 13px; color: var(--ink-2); }
.quick a.em { border-color: var(--red); }
.quick a.em b { color: var(--red); }
.section-h { font-size: 22px; margin: 32px 0 12px; }

/* Speed tape */
.tape-wrap { background: var(--panel); color: var(--panel-ink); border-radius: var(--r); padding: 14px 12px 10px; }
.tape-wrap h2 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--panel-ink-2); margin: 0 4px 6px; display: flex; justify-content: space-between; }
.tape-wrap svg { display: block; width: 100%; height: auto; }
.tape-wrap .t-lab { font-family: var(--f-display); font-size: 13px; fill: var(--panel-ink); }
.tape-wrap .t-val { font-family: var(--f-display); font-weight: 700; font-size: 15px; fill: var(--panel-ink); font-variant-numeric: tabular-nums; }
.tape-wrap .t-tick { stroke: var(--panel-ink-2); }
.tape-wrap .t-scale { font-family: var(--f-display); font-size: 11px; fill: var(--panel-ink-2); }
.tape-wrap .t-lead { stroke: var(--panel-ink-2); stroke-width: 1; fill: none; opacity: .7; }
.tape-key { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--panel-ink-2); margin: 8px 4px 0; }
.tape-key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ---------- Learn ---------- */
.topic-list { display: grid; gap: 10px; }
.topic-list a {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 14px 14px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
}
.topic-list a:hover { border-color: var(--ink-2); }
.topic-list .tn { grid-row: span 2; font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.topic-list b { font-family: var(--f-display); font-size: 20px; line-height: 1.1; }
.topic-list .ts { grid-column: 2; font-size: 14px; color: var(--ink-2); }
.topic-list .tm { grid-column: 3; grid-row: 1 / span 2; width: 56px; text-align: right; font-size: 12px; color: var(--ink-2); }
.topic-list .tm .meter { margin-top: 4px; }
.topic-list a.warnish b { color: var(--red); }

/* ---------- Topic page ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.crumbs a { text-decoration: none; }
.topic-head { border-bottom: 3px solid var(--ink); padding-bottom: 10px; margin-bottom: 8px; }
.topic-head h1 { font-size: clamp(30px, 7vw, 42px); }
.topic-head .ref { font-family: var(--f-display); font-size: 14px; letter-spacing: .08em; color: var(--ink-2); }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; }
.toc a { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); text-decoration: none; }
.prose { max-width: 68ch; }
.prose h3 {
  font-size: 15px; letter-spacing: .07em; text-transform: uppercase; margin: 28px 0 10px;
  background: var(--panel); color: var(--panel-ink); padding: 6px 10px; border-radius: 4px; scroll-margin-top: 80px;
}
.prose h3.flash { box-shadow: 0 0 0 3px var(--amber); }
.prose h4 { font-size: 17px; margin: 0 0 6px; }
.prose p, .prose ul, .prose ol { margin: 0 0 12px; }
.prose ul, .prose ol { padding-left: 22px; }
.prose li { margin: 3px 0; }
.prose li::marker { color: var(--ink-2); }
.prose .big { font-family: var(--f-display); font-weight: 700; font-size: 56px; line-height: 1; margin: 4px 0 8px; color: var(--red); font-variant-numeric: tabular-nums; }
.prose .placard { font-family: var(--f-display); font-weight: 700; letter-spacing: .03em; border: 2px solid var(--ink); padding: 10px 12px; border-radius: 4px; background: var(--surface); }
.scroll { overflow-x: auto; margin: 0 0 14px; }
.scroll table { margin: 0; }
table.grid, table.kv { border-collapse: collapse; width: 100%; margin: 0 0 14px; font-size: 15px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
table.grid th, table.grid td, table.kv th, table.kv td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
table.grid thead th { font-family: var(--f-display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); }
table.grid tr:last-child td, table.kv tr:last-child th, table.kv tr:last-child td { border-bottom: 0; }
table.kv th { width: 46%; font-weight: 500; color: var(--ink-2); }
td.num { font-family: var(--f-display); font-weight: 700; font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.red { color: var(--red); }
.callout { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; margin: 0 0 14px; }
.callout.warn { border-left-color: var(--red); background: var(--red-bg); }
.callout ol, .callout ul { margin: 6px 0 0; }
.cols2 { display: grid; grid-template-columns: 1fr; gap: 0 18px; }
@media (min-width: 560px) { .cols2 { grid-template-columns: 1fr 1fr; } }
.cols2 > div { min-width: 0; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin: 0 0 14px; }
details summary { cursor: pointer; font-weight: 600; }
.lamps { display: grid; gap: 14px; margin-bottom: 10px; }
.lamps > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lamps h4 { width: 100%; }
.lamp { font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .02em; padding: 6px 8px; border-radius: 3px; color: #fff; min-width: 92px; text-align: center; line-height: 1.1; }
.lamp.r { background: #c4161c; } .lamp.a { background: #e8a317; color: #1a1205; } .lamp.g { background: #2e8b57; }
.disc { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 2px 14px 4px; margin-bottom: 10px; }
.disc h3 { background: none; color: var(--ink); padding: 0; margin: 12px 0 6px; font-size: 16px; text-transform: none; letter-spacing: .01em; }
.disc .use { font-weight: 600; color: var(--green); }
.circuit-list { counter-reset: none; }
.circuit-svg { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 0 0 12px; }
.circuit-svg svg { display: block; width: 100%; height: auto; }
.circuit-svg .rw { fill: var(--ink-2); }
.circuit-svg .path { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.circuit-svg .dot { fill: var(--amber); stroke: var(--ink); stroke-width: 1; }
.circuit-svg .lab { font-family: var(--f-display); font-weight: 700; font-size: 12px; fill: var(--ink); }
.circuit-svg .note { font-family: var(--f-display); font-size: 11px; fill: var(--ink-2); }
.circuit-svg .arrow { fill: var(--ink); }
.topic-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.topic-foot a { text-decoration: none; max-width: 48%; }
.topic-foot small { display: block; color: var(--ink-2); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.topic-foot b { font-family: var(--f-display); font-size: 18px; }
.topic-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 0; }

/* ---------- Checklist ---------- */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); margin-bottom: 16px; }
.seg button { border: 0; background: transparent; padding: 10px 6px; font: 700 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; color: var(--ink-2); min-height: 44px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button.em[aria-pressed="true"] { background: var(--red); color: var(--on-color); }
.limits-card { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
@media (min-width: 560px) { .limits-card { grid-template-columns: repeat(4, 1fr); } }
.limits-card span { background: var(--surface); padding: 6px 10px; font-family: var(--f-display); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.chk-sec { margin-bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.chk-sec > header {
  display: flex; align-items: center; gap: 10px; background: var(--panel); color: var(--panel-ink); padding: 8px 10px 8px 12px;
}
.chk-sec.em > header { background: var(--red); color: var(--on-color); }
.chk-sec .n { font-family: var(--f-display); font-weight: 700; font-size: 17px; min-width: 26px; }
.chk-sec .tt { flex: 1; min-width: 0; }
.chk-sec .tt b { font-family: var(--f-display); font-size: 17px; letter-spacing: .06em; text-transform: uppercase; display: block; line-height: 1.1; }
.chk-sec .tt small { font-size: 12px; opacity: .8; }
.chk-sec .prog { font-family: var(--f-display); font-size: 14px; opacity: .85; font-variant-numeric: tabular-nums; }
.chk-sec .reset { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; font: 600 12px var(--f-body); padding: 4px 8px; cursor: pointer; }
.chk-sec.done > header::after { content: "✓"; font-weight: 700; margin-left: 2px; }
.chk-row .cr { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.chk-row {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; padding: 10px 12px; cursor: pointer; min-height: 44px;
}
.chk-row:last-child { border-bottom: 0; }
.chk-row .box { flex: 0 0 18px; height: 18px; border: 2px solid var(--ink-2); border-radius: 4px; transform: translateY(3px); display: grid; place-items: center; }
.chk-row .c { flex: 0 1 auto; min-width: 0; font-size: 15px; }
.chk-row .lead { flex: 1 1 12px; border-bottom: 2px dotted var(--line); min-width: 12px; transform: translateY(-4px); }
.chk-row .r { flex: 0 1 auto; margin-left: auto; max-width: 100%; text-align: right; font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .03em; }
.chk-row.on { background: var(--green-bg); }
.chk-row.on .box { background: var(--green); border-color: var(--green); }
.chk-row.on .box::after { content: ""; width: 5px; height: 9px; border: solid var(--on-color); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.chk-row.on .c, .chk-row.on .r { color: var(--ink-2); }
.chk-note { padding: 8px 12px 8px 40px; font-size: 14px; font-style: italic; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.chk-warn { padding: 8px 12px 8px 36px; font-size: 14px; font-weight: 600; background: var(--red-bg); color: var(--red); border-bottom: 1px solid var(--line); border-left: 4px solid var(--red); }
.chk-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0 14px; flex-wrap: wrap; }

/* ---------- Flashcards ---------- */
.deck-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
.flash { perspective: 1200px; margin: 0 0 14px; }
.flash-in {
  position: relative; min-height: 300px; border-radius: 14px; cursor: pointer;
  transition: transform .45s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d;
}
.flash-in.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 20px 20px 18px;
  display: flex; flex-direction: column; overflow: auto;
}
.face.back { transform: rotateY(180deg); border-top: 5px solid var(--green); }
.face .meta { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.face .q { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 5.5vw, 30px); line-height: 1.15; margin: auto 0; padding: 18px 0; text-wrap: balance; }
.face .a { font-size: 18px; margin: 14px 0 8px; }
.face .a b.big { font-family: var(--f-display); font-size: 30px; display: block; line-height: 1.1; }
.face .a ol, .face .a ul { padding-left: 22px; margin: 4px 0; }
.face .x { color: var(--ink-2); font-size: 15px; }
.face .hint { font-size: 13px; color: var(--ink-2); text-align: center; }
.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grade .btn { min-height: 52px; font-size: 16px; }
.grade .again { color: var(--red); border-color: var(--red); }
.grade .got { background: var(--green); border-color: var(--green); color: var(--on-color); }
@media (prefers-reduced-motion: reduce) { .flash-in { transition: none; } }

/* ---------- Quiz ---------- */
.q-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 15px; letter-spacing: .06em; color: var(--ink-2); margin-bottom: 8px; }
.q-prog { height: 4px; background: var(--surface-2); border-radius: 2px; margin-bottom: 18px; overflow: hidden; }
.q-prog i { display: block; height: 100%; background: var(--accent); }
.q-text { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 5.5vw, 30px); line-height: 1.15; margin: 0 0 16px; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; min-height: 54px;
  border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16px;
}
.opt:hover:not(:disabled) { border-color: var(--ink-2); }
.opt .k { flex: 0 0 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-2); font: 700 14px var(--f-display); }
.opt.right { border-color: var(--green); background: var(--green-bg); }
.opt.right .k { background: var(--green); color: var(--on-color); }
.opt.wrong { border-color: var(--red); background: var(--red-bg); }
.opt.wrong .k { background: var(--red); color: var(--on-color); }
.opt:disabled { cursor: default; }
.explain { margin: 14px 0; padding: 12px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.explain b { font-family: var(--f-display); letter-spacing: .04em; }
.result-big { font-family: var(--f-display); font-weight: 700; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; }
.missed { display: grid; gap: 8px; margin: 14px 0; }
.missed div { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 6px; padding: 10px 12px; }
.missed div p { margin: 0; }
.missed div p + p { margin-top: 4px; color: var(--green); font-weight: 600; }
.best-list { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: 14px; margin-top: 8px; }
.best-list span:nth-child(2n) { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Search ---------- */
.results h2 { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin: 22px 0 8px; }
.results a, .results .res { display: block; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; text-decoration: none; color: var(--ink); }
.results a:hover { border-color: var(--ink-2); }
.results b { font-weight: 600; }
.results small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.results mark { background: var(--amber-bg); color: inherit; border-radius: 2px; padding: 0 1px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 10px; }

.about { margin-top: 36px; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 14px; max-width: 68ch; }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 40;
}
@media (min-width: 960px) { .toast { bottom: 24px; } }

  html: `
<h3 id="overview-intro">What it is</h3>
<p>A two-seat tandem military ab initio trainer from the Yakovlev bureau, built under licence by Aerostar in Bacău, Romania from 1979 (over 1,700 built). All-metal airframe with fabric-covered control surfaces, semi-retractable tricycle gear, and a 360 hp Vedeneyev M-14P radial. Gear, flaps, brakes and engine starting all run on compressed air. Electrics are 24 V.</p>
<p>Each panel has three gyros, and the rear (instructor) cockpit can simulate instrument failures in the front cockpit.</p>
<h3 id="overview-dims">Dimensions</h3>
<table class="kv"><tbody>
<tr><th>Wingspan</th><td>9.30 m</td></tr>
<tr><th>Length</th><td>7.745 m</td></tr>
<tr><th>Height</th><td>2.70 m</td></tr>
<tr><th>Wing area</th><td>15.0 m²</td></tr>
<tr><th>Aspect ratio</th><td>5.77</td></tr>
<tr><th>Dihedral / incidence</th><td>2° / 2°</td></tr>
<tr><th>Gear track / wheelbase</th><td>2.715 m / 1.86 m</td></tr>
</tbody></table>
<h3 id="overview-weights">Weights</h3>
<table class="kv"><tbody>
<tr><th>Dry weight</th><td>823 kg</td></tr>
<tr><th>Typical take-off weight</th><td>1060 kg</td></tr>
<tr><th>Max take-off &amp; landing weight</th><td><b>1315 kg</b></td></tr>
<tr><th>Parachute</th><td>12.3 kg each</td></tr>
</tbody></table>
<h3 id="overview-crew">Crew and flight conditions</h3>
<ul>
<li>Maximum two crew. <b>Solo flight is from the front cockpit only.</b></li>
<li>Day VFR only. Not approved for known icing or night (no cockpit or nav lights as standard).</li>
<li>Maximum permitted altitude <b>10,000 ft</b> (no oxygen system). Performance ceiling is 13,100 ft.</li>
<li>Operates from hard runways or grass.</li>
</ul>`

<li><b>Crosswind:</b> maximum component 12 kt (22 km/h).</li>

<h3 id="engine-m14p">M-14P</h3>
<p>Nine-cylinder, air-cooled, supercharged, gear-driven radial with a pressure carburettor (no float chamber, automatic mixture control). Reduction ratio 0.658. Take-off rating 360 hp (−2 %) for 5 minutes at 99 % (2900 prop RPM). RPM is shown in percent.</p>
<h3 id="engine-power">Power settings</h3>

</tbody></table></div>
<p class="small">Max CHT 220 °C and max oil 75 °C at every setting; up to 240 °C / 85 °C for a short period (see Where the POH disagrees).</p>
<h3 id="engine-temps">Temperatures (°C)</h3>

<tr><td>Carb inlet air</td><td class="num">10</td><td class="num">10–45</td><td class="num">45</td><td>—</td></tr>
</tbody></table></div>
<h3 id="engine-press">Pressures (kg/cm²)</h3>
<table class="grid"><thead><tr><th></th><th>Normal</th><th>Idle min</th></tr></thead><tbody>
<tr><td>Oil</td><td class="num">4–6</td><td class="num">1</td></tr>
<tr><td>Fuel</td><td class="num">0.2–0.5</td><td class="num">0.15</td></tr>
</tbody></table>
<h3 id="engine-prop">Propeller</h3>
<table class="kv"><tbody>
<tr><th>Model</th><td>V530TA-D35, two-blade</td></tr>
<tr><th>Diameter</th><td>2.4 m</td></tr>
<tr><th>Type</th><td>Constant speed, hydraulically actuated</td></tr>
<tr><th>Blade angle at 1 m</th><td>14.5° fine to 34.5° coarse</td></tr>
<tr><th>Max</th><td>99 % (2900 RPM)</td></tr>
</tbody></table>
<p>Oil pressure holds the blades in fine pitch. A real loss of oil pressure (not a gauge fault) therefore also shows as an RPM drop, unless the prop lever was already fully back.</p>
<h3 id="engine-cooling">Cooling controls (front cockpit only)</h3>
<ul>
<li><b>Cowl gills:</b> lever on the left. Fully forward = open (maximum cooling). Fully back = closed (warm-up).</li>
<li><b>Oil cooler door:</b> cooler sits under the right wing; lever on the right. Forward = open, back = closed.</li>
<li>One friction lock serves both levers: forward to lock, back to free.</li>
<li><b>Carb heat:</b> yellow lever on the right. Press it down, then move. Fully forward = cold, fully back = hot. Carb inlet temperature has its own gauge.</li>
</ul>`

<li>Grade: 100LL or 91/96.</li>
<li>Full tanks: fuel no more than 30 mm below the filler rim.</li>
<li>Rear panel warning lights show <b>Fuel 12 L in left tank</b> and <b>right tank</b>.</li>
<li>Drain ½ L from the central drain before the first flight, and again 10 minutes after any refuelling.</li>

<table class="grid"><thead><tr><th>Stage</th><th>Fuel L</th><th>Min</th></tr></thead><tbody>

<tr><td>Take-off &amp; climb to 500 m</td><td class="num">3</td><td class="num">2</td></tr>
<tr><td>Descent from 500 m</td><td class="num">0.5</td><td class="num">1</td></tr>
<tr><td>Circuit at 180 km/h</td><td class="num">4</td><td class="num">5</td></tr>
</tbody></table>
<p>Cruise 2 burns about <b>42 L/h</b>. Real consumption varies a lot between aircraft, engines and pilots.</p>
<h3 id="oil-system">Oil</h3>
<ul>
<li>Tank has a flop tube so oil is picked up in any attitude.</li>
<li>Capacity: <b>16 L max</b> (cross-country), <b>10 L recommended for aerobatics</b>, <b>8 L minimum</b>.</li>
<li>Grade: MIL-L-6082 straight mineral for the first 50 hours, then MIL-L-22851 ashless dispersant. Grade 100 (SAE 50) in cooler climates, 120 (SAE 60) in warmer.</li>
<li>An oil dilution system is fitted for very cold starts (switch on the right panel, used momentarily). It is rarely needed.</li>
<li>In cold weather oil pressure may sit near 1 kg/cm² after start until the oil warms.</li>

{
  id: "air", title: "Pneumatic system", ref: "2.3, 4.2.11, 4.3.5, 3.2.7",
  summary: "Main and emergency air, what each can and cannot do.",
  html: `
<h3 id="air-uses">What runs on air</h3>
<p>Engine starting, flaps, landing gear and brakes. The main system is recharged in flight by an engine-driven compressor and can be recharged on the ground.</p>
<h3 id="air-press">Pressures</h3>
<ul>
<li>Normal range for <b>main</b> and <b>emergency</b> bottles: <b>40–50 kg/cm²</b> (about 50 before start).</li>
<li>Minimum main pressure to attempt a normal gear extension: about 10–15.</li>
<li>One gauge in the front cockpit shows both systems.</li>
</ul>
<h3 id="air-emerg">Emergency air</h3>
<div class="cols2">
<div><h4>Can</h4><ul><li>Lower the gear</li><li>Work the brakes</li></ul></div>
<div><h4>Cannot</h4><ul><li>Start the engine</li><li>Retract the gear</li><li>Lower the flaps</li></ul></div>
</div>
<h3 id="air-valves">Valves and housekeeping</h3>
<ul>
<li>The <b>main air valve</b> is opened before start (fully on, anti-clockwise, then a quarter turn back) and closed after flight to save air.</li>
<li>The <b>emergency air valve</b> on the right side panel stays closed (clockwise). A folding bar gives extra leverage to open it.</li>
<li>A drain on the firewall sediment filter removes moisture after each flight.</li>
<li>Brake hard and often during long taxis and the main air runs down.</li>
</ul>`
},
{
  id: "gear-flaps", title: "Gear & flaps", ref: "4.2.9–4.2.10, 4.5.3",
  summary: "Selector logic between cockpits, indications, no squat switches.",
  html: `
<h3 id="gear-selectors">Gear selectors</h3>
<ul>
<li>A selector in each cockpit: UP, neutral, DOWN, with a safety gate (lock bar) to engage when down.</li>
<li>The <b>rear selector is the master</b>. With it at neutral, the front cockpit has command.</li>
<li>For solo flight the rear gear selector is set to <b>neutral</b>.</li>
<li><b>Always slide the lock bar across</b> after selecting gear down.</li>
</ul>
<h3 id="gear-ind">Indications</h3>
<ul>
<li>Three green lights = down, three red = up.</li>
<li>Three mechanical indicators that show coloured bands when the gear is down (the POH mentions six bands, with indicators on the wings).</li>
</ul>
<div class="callout warn"><b>No squat switches and no gear-up warning.</b> Selecting gear up on the ground will retract it and the aircraft settles onto the ground.</div>
<p>The gear is semi-retractable: the wheels stay partly exposed when up. Forced landings off an airfield are flown gear up.</p>
<h3 id="flaps">Flaps</h3>
<ul>
<li>Two positions: <b>0° and 45°</b>.</li>
<li>Selector in each cockpit. Either one at neutral gives command to the other cockpit. Solo: rear flap lever at neutral.</li>
<li>Lights in each cockpit: <b>green = up</b>, <b>orange = down</b>.</li>
<li>Expect about 30 ft of sink when retracting flaps.</li>
<li>Emergency air will not lower the flaps.</li>
</ul>
<h3 id="gear-rear">Rear seat gear lever</h3>
<p>A safety pilot in the back should work the rear gear lever between down and neutral so the front pilot cannot retract the gear by mistake instead of the flaps. Non-pilots in the back never touch it; leave it at neutral.</p>`
},

{
  id: "cockpit", title: "Cockpit & avionics", ref: "4.2.8, 4.2.12, 4.5.2, 8.1, 8.9–8.12",
  summary: "Which controls are in which cockpit, trim, intercom, radio, gyrocompass and ADF.",
  html: `
<h3 id="cockpit-both">In both cockpits</h3>
<p>Throttle (radio and intercom buttons on it), prop pitch lever, friction lock, fuel valve, magneto selector, covered starter button, gear lever with latch, flap lever, trim wheel, 3 greens / 3 reds, flap lights, air gauge, ASI, altimeter, attitude indicator, ADF, VSI with slip ball, triple gauge (oil temp, oil pressure, fuel pressure), clock, CHT, G-meter, warning lights, compass and an emergency air valve.</p>
<h3 id="cockpit-front">Front cockpit only</h3>
<p>Primer, cowl gills, oil cooler, carb heat, manifold pressure, carb air temperature, voltmeter, fuel gauge, oil dilution, VHF dial, stall warning button, front switch block, cabin heat and the ADF control box.</p>
<h3 id="cockpit-rear">Rear cockpit only</h3>
<ul>
<li><b>Ignition transfer switch</b> (front/rear): gives the rear cockpit command of the magnetos. Solo: "1 COCKPIT" (up).</li>
<li><b>Failure imitators</b>: instruments, ASI, horizon, slip/climb and altimeter. Off (down) for normal flight.</li>
<li><b>Brake override</b>: lets the instructor take the brakes. Solo: off (back).</li>
</ul>
<p class="small">The POH notes these instructor functions may be disabled on some aircraft. Brief the front pilot not to select magnetos to 0 during the check and to brake gently, especially on wet grass.</p>
<h3 id="cockpit-trim">Trim</h3>
<p>Cockpit-adjustable tab on the left (port) elevator, working in the normal sense. Rudder and aileron tabs are ground-adjustable only.</p>
<h3 id="cockpit-comms">Intercom and radio</h3>
<ul>
<li>Intercom is not voice-activated: use the <b>lower</b> button on the throttle. Two identical channels for redundancy.</li>
<li>Transmit with the <b>upper</b> button on the throttle.</li>
<li>720-channel VHF on the lower right of the panel. Squelch: down = high sensitivity, up = low.</li>
<li>Before start: intercom and radio volumes to max, reserve amplifier and NDB ident off, master radio volume max, squelch on.</li>
</ul>
<h3 id="cockpit-gyro">Gyrocompass</h3>
<p>Slaved gyro with latitude compensation. Slaved mode: SLAVE forward, hemisphere switch to your hemisphere, approximate latitude in the window. Free mode: FREE, then set the heading with ADJUST (the 0°/300° switch slews quickly).</p>
<div class="callout">The POH was compiled from UK sources and says <b>Northern</b>. Flying in South Africa, set the hemisphere switch to <b>Southern</b> and your latitude (Cape Town ≈ 34° S, Johannesburg ≈ 26° S).</div>
<h3 id="cockpit-adf">Radio compass (ADF, APK-15M)</h3>
<p>Eight preset channels in two banks of four (knob 1–4, plus the A/b switch under the glareshield). Frequencies are set on rotary switches in two boxes behind the rear seat. Panel switches: ADF/Antenna (bearing or audio only), Voice/Ident, Test (needle rotates), volume.</p>
<details><summary>Setting ADF frequencies (Tables A and B)</summary>
<p>Box A (left) and box b (right) each have four rows of four switches. Rows I–IV map to channels: A-1 Left I, b-1 Left II, A-2 Left III, b-2 Left IV, A-3 Right I, b-3 Right II, A-4 Right III, b-4 Right IV.</p>
<p>First three switches: hundreds, tens and units of kHz (ignore a leading 1 on four-digit frequencies). Fourth switch: 0 or .5 kHz plus the band: I 150–239.5, II 240–399.5, III 400–699.5, IV 700–1199.5, V 1199.5–1799.5 kHz.</p>
</details>`
},
{
  id: "start", title: "Starting & run-up", ref: "4.3.1–4.3.5, 4.4.5",
  summary: "Pull-through, priming rule, start technique, warm-up and every run-up figure.",
  html: `
<h3 id="start-pull">Pull-through (hydraulic lock)</h3>
<p>Oil drains into the lower cylinders of a radial. Starting with a hydraulic lock can wreck the engine. With both magnetos at 0 in both cockpits, pull the prop through by hand in the normal direction of rotation only: <b>12–18 revolutions</b> recommended (at least 10 on the daily check). Drain the manifold oil through the drain or by removing the plugs, especially if there's resistance or the aircraft hasn't run for a while.</p>
<div class="callout warn">Never pull the prop through with the CHT showing <b>80 °C or more</b>. Never rotate the prop backwards.</div>
<p>Only after the pull-through: rear cockpit magneto to <b>1+2</b>.</p>
<h3 id="start-prime">Priming rule</h3>
<p>Primer on the upper right of the front panel. Three positions: <b>left</b> pressurises the fuel system, <b>right</b> primes the cylinders, <b>upright</b> is neutral.</p>
<div class="callout">One prime into the cylinders for every <b>10 °C below 100 °C</b> on the CHT. CHT 40 = 6 primes, CHT 60 = 4, CHT 100+ = none. Max 9.</div>
<ul>
<li>Prime while the ground crew turns the prop, one prime per half turn.</li>
<li>Start counting once the primer is full (a couple of strokes; you feel resistance).</li>
<li>Over-priming washes oil off the cylinder walls and can cause a hydraulic lock or a fire.</li>
<li>Wait about <b>2 minutes</b> after priming before starting so the fuel can vaporise. Start the clock.</li>
</ul>
<h3 id="start-sequence">Start</h3>
<ol>
<li>Call "CLEAR PROP". Master, generator and ignition ON (up).</li>
<li>Primer LEFT and pump to about 0.5 kg/cm² fuel pressure (2–6 strokes). This is needed whatever the CHT.</li>
<li>Primer fully forward, upright and locked.</li>
<li>Left thumb on the starter button and hold it. After ½–1 prop turn, flick the magnetos to 1+2 with your left fingers, <b>still holding</b> the button.</li>
<li>Release once the engine runs (normally 3–5 s). <b>Max 15 s</b> on the starter.</li>
<li>Set 38–41 %.</li>
</ol>
<p>Cold engine (CHT ≤20–30 °C) that won't pick up: 3–5 extra primes into the cylinders while cranking with mags on 1+2, then lock the primer. Throttle pumping between ⅓ and ½ travel every 1.5–3 s also helps, but don't overdo it.</p>
<div class="callout warn">If over-priming starts a fire, <b>keep cranking</b> to suck it through. If the primer is left open after start, the engine draws fuel through it and runs rough.</div>
<h3 id="start-after">After start</h3>
<ul>
<li>Primer locked, starter cover closed.</li>
<li><b>Oil pressure ≥1 kg/cm² within 15–20 s</b>, otherwise shut down and investigate.</li>
<li>Warm up at 41–44 % until oil temperature starts rising, then 44–48 % (up to 51 % in winter).</li>
<li>If external power was used: master ON (up), then disconnect.</li>
<li>Generator on line: red light out, ammeter needle left of zero. Press and release the attitude indicator knob, then CBs 3, 5, 7, 8 on. Lamp test.</li>
<li>Use the gills to keep the CHT in limits during warm-up.</li>
<li>Warmed up: <b>CHT above 120 °C, oil at least 40 °C</b>.</li>
</ul>
<h3 id="start-runup">Run-up (prop fully fine, brakes held)</h3>
<table class="grid"><thead><tr><th>Check</th><th>Expect</th></tr></thead><tbody>
<tr><td>70 %, cycle prop ×3; lever fully back</td><td class="num">≈53 %</td></tr>
<tr><td>70 %, prop back to 64 %, MP ±100 mm</td><td>RPM stays 64 % (brief swing OK)</td></tr>
<tr><td>Magnetos at 70 %</td><td class="num">max drop 3 %</td></tr>
<tr><td>Throttle idle</td><td class="num">24–28 %, steady</td></tr>
<tr><td>At idle: fuel / oil pressure</td><td class="num">≥0.15 / ≥1.0</td></tr>
<tr><td>Volt-ammeter button</td><td class="num">battery 24 V</td></tr>
<tr><td>Idle to 80 % in 1–2 s</td><td>No hesitation or misfire</td></tr>
<tr><td>58 %</td><td class="num">generator 27–29 V</td></tr>
<tr><td>Throttle slowly back / forward</td><td class="num">gen light on ≈34 %, off 36–38 %</td></tr>
</tbody></table>
<p>A 4–5 % mag drop after the first start of the day is usually fouled plugs. Get the CHT to 190 °C, run 80 % for 15–20 s (check the brakes hold), back to 70 % and recheck. Still out of limits: get an engineer.</p>`
},
{
  id: "flying", title: "Flying the circuit", ref: "4.1–4.2, 4.4.6–4.4.18",
  summary: "Taxi, take-off, climb, cruise, the recommended circuit, landing, go-around and shutdown.",
  html: `
<h3 id="fly-speeds">Normal speeds (km/h IAS, any weight up to 1315 kg)</h3>
<table class="kv"><tbody>
<tr><th>Take-off and climb</th><td>170</td></tr>
<tr><th>Approach, flaps down / up</th><td>160 / 170</td></tr>
<tr><th>Max manoeuvring</th><td>360</td></tr>
<tr><th>Never exceed</th><td>420</td></tr>
<tr><th>Max crosswind</th><td>22 km/h (12 kt)</td></tr>
</tbody></table>
<h3 id="fly-taxi">Taxi</h3>
<p>The nosewheel castors freely. Steer with rudder plus short squeezes of brake. Avoid turns so tight that the nosewheel can't be straightened; you may have to shut down and push. Long brake applications fade the brakes and drain the main air. On wet grass the wheels lock easily (no anti-skid), so blip the brakes.</p>
<h3 id="fly-circuit">Recommended circuit</h3>
<div data-widget="circuit"></div>
<ol class="circuit-list">
<li>Take-off run: at 90 km/h raise the nosewheel.</li>
<li>Lift-off at 120 km/h; hold the take-off attitude.</li>
<li>Initial climb, 160 km/h, 20 m (60 ft): brakes check, gear up.</li>
<li>Climb, 170 km/h, 50 m (150 ft): reduce power to 82 %.</li>
<li>First turn, 170 km/h, 150 m (500 ft), 82 %, max 30° bank.</li>
<li>Crosswind, 170 km/h. At 300 m (1000 ft) level off, 64 %, accelerate to 200 km/h.</li>
<li>Second turn onto downwind: 200 km/h, 1000 ft, 64 %.</li>
<li>Downwind: 200 km/h, 1000 ft, 64 %. Gear down, downwind checks, call downwind.</li>
<li>Third turn: 200 km/h, 1000 ft, 64 %. Onto base, hold height, slow to 180 km/h, base checks.</li>
<li>Base: 180 km/h, 64 %. Start descent, prop fully fine, 170 km/h at 4–5 m/s.</li>
<li>Final turn: 170 km/h, 4–5 m/s, max 30° bank.</li>
<li>Final: 170 km/h. After the turn, flaps down (not below 150 m / 500 ft). Call "Finals, three greens".</li>
<li>Final approach 160 km/h. Checks: three greens, flaps down, prop fully forward, runway clear.</li>
<li>Round-out at 5–6 m (15–20 ft), flare, close the throttle.</li>
<li>Go-around: flaps up (check it is not the gear lever), advance to 100 % smoothly over about 3 s.</li>
</ol>
<h3 id="fly-to">Take-off and climb</h3>
<ul>
<li>Before take-off: 44 %, prop fully forward, gills fully forward (open), oil cooler as required, instruments and warning lights checked.</li>
<li>Release brakes, throttle smoothly to full. Expect to need left rudder.</li>
<li>Stick back at 70–90 km/h to take weight off the nosewheel. Lift-off around 120 km/h. Let the speed build to 170 km/h and climb at that speed.</li>
<li>Gear up and check the three reds. Climb power 82 % / ambient +95 mm.</li>
</ul>
<h3 id="fly-cruise">Cruise and descent</h3>
<p>Cruise at 64 % (735 mm). Gills, oil cooler, carb heat and trim as required.</p>
<div class="callout warn"><b>Carb icing in the descent can jam the throttle.</b> Close the gills to maximise heat, select carb heat HOT, and gently work the throttle back and forth until it frees. Keep making small movements if icing is severe.</div>
<h3 id="fly-landing">Before landing and landing</h3>
<ul>
<li>Altimeter set. Gear down below 200 km/h, three greens, <b>lock bar across</b>. Approach 160 km/h, prop fully forward, power, gills and carb heat as required.</li>
<li>Flaps on final (V<sub>FE</sub> 170). Side-slipping with flaps is permitted.</li>
<li>Round-out at 10–20 m in the transition, touch down nose-up, hold the stick back, rudder as needed, brake in short pulses.</li>
</ul>
<h3 id="fly-ga">Go-around (balked landing)</h3>
<ul>
<li>Full throttle with the prop in fine pitch.</li>
<li>Climb at 160–170 km/h with a positive rate. Gear up.</li>
<li>Flaps up at about 250 ft. Expect around 30 ft of sink as they come up.</li>
</ul>
<h3 id="fly-shutdown">After landing and shutdown</h3>
<ol>
<li>After landing: gills and oil cooler fully open (forward).</li>
<li>Idle at 28–34 % until the CHT is below 160 °C.</li>
<li>65–68 % for 20–30 s to clear the plugs, then back to 28–34 %.</li>
<li>Magnetos off. Throttle forward about 2 inches. All switches off, master to centre.</li>
</ol>
<h3 id="fly-post">Post-flight</h3>
<p>Main air off. Release brakes. Magnetos to 0 in both cockpits. Rear gear lever down. Gills and oil cooler closed. Drain the firewall air filter. Clean off oil. Refuel to full to limit condensation. Control locks and pitot cover on. Tech log entry with any defects. End of the day: covers, oil cooler blank, tie down or hangar and chock.</p>`
},
{
  id: "emergencies", title: "Emergencies", ref: "3.1–3.2",
  summary: "Engine failures, pressures, vibration, overspeed, fire, emergency gear and abandoning the aircraft.",
  html: `
<h3 id="em-speeds">Emergency speed</h3>
<p class="big">160 km/h</p>
<p>Engine failure after take-off, emergency manoeuvring, best glide, precautionary landing and power-off landing are all flown at 160 km/h.</p>
<h3 id="em-efato">Engine failure after take-off (upwind, before the first turn)</h3>
<ol>
<li>Stick forward, establish the descent at 160 km/h.</li>
<li>Gear UP.</li>
<li>Choose a landing area ahead and adjust the approach.</li>
<li>MAYDAY if time permits.</li>
<li>Fuel stop-valve closed (fully back).</li>
<li>Magnetos, master, generator and ignition off.</li>
<li>Open the canopy.</li>
<li>Flaps when appropriate to reduce ground speed.</li>
</ol>
<div class="callout warn">Do not turn back to the airfield. Land straight ahead, turning only to avoid danger. Above about 600 ft after the first turn, or in the aerobatic area, decide whether you can reach the field.</div>
<h3 id="em-forced">Forced landing</h3>
<ol>
<li>Trade speed for height if possible. Descend at 160 km/h.</li>
<li>Gear UP. Select a field and plan the approach.</li>
<li>MAYDAY. Fuel stop-valve closed. Brief the passenger.</li>
<li>Magnetos, master, generator, ignition off. Canopy open. Harnesses tight.</li>
<li>Flaps once certain of the field. Side-slip if needed.</li>
</ol>
<table class="grid"><thead><tr><th>Height</th><th>Glide, nil wind</th></tr></thead><tbody>
<tr><td class="num">1000 ft</td><td class="num">1.0 nm</td></tr>
<tr><td class="num">2000 ft</td><td class="num">2.0 nm</td></tr>
<tr><td class="num">3000 ft</td><td class="num">3.5 nm</td></tr>
<tr><td class="num">4000 ft</td><td class="num">4.5 nm</td></tr>
<tr><td class="num">5000 ft</td><td class="num">5.5 nm</td></tr>
</tbody></table>
<p class="small">Gear and flaps up, no turns. Best glide 160 km/h in all configurations, best range clean. A 360° turn at 45° bank and 160 km/h loses about 220 m (≈750 ft) at about 8 m/s. A 10 kt headwind cuts the distance by about 10 %.</p>
<h3 id="em-inverted">Engine failure in inverted flight</h3>
<ol>
<li>Half-roll to erect.</li>
<li>Descend at 170–180 km/h.</li>
<li>Throttle to one-third of its travel.</li>
<li>Primer 45° left and pump until fuel pressure reads 0.1–0.2 kg/cm² or more. Priming into the cylinders (primer right) is recommended.</li>
<li>As soon as it fires, throttle fully forward within 1–2 s, then set the power you want.</li>
</ol>
<p>Expect a height loss of <b>1200–1500 ft</b>.</p>
<h3 id="em-oil">Oil pressure falling</h3>
<p>The engine could stop at any time. Check the oil temperature.</p>
<ul>
<li><b>Rising:</b> land immediately at the nearest airfield, or prepare a forced landing gear up.</li>
<li><b>Not rising:</b> watch it closely, go to the nearest airfield and make a precautionary landing as soon as possible.</li>
</ul>
<p>Real oil pressure loss also drops the RPM, because oil pressure keeps the blades fine (unless the prop lever is already fully back).</p>
<h3 id="em-fuel">Fuel pressure falling</h3>
<p>Signs: rough running, RPM and manifold pressure loss, vibration. Check the fuel stop-valve is fully open (forward). Primer 45° left and pump. Precautionary landing.</p>
<h3 id="em-vib">Engine vibration</h3>
<ol>
<li>(Unless fuel pressure is falling) if height allows, reduce RPM to minimum and descend.</li>
<li>If it stops, ease the throttle forward to hold level flight.</li>
<li>If it continues after power changes, raise RPM to 70 % to clean the plugs.</li>
<li>Still vibrating: find the setting with least vibration and land as soon as possible.</li>
</ol>
<h3 id="em-overspeed">Propeller overspeed</h3>
<div class="cols2">
<div><h4>After take-off</h4><ol><li>Slowly bring the prop lever back</li><li>Continue the take-off</li><li>Fly a circuit and land</li></ol></div>
<div><h4>During aerobatics</h4><ol><li>Throttle to idle</li><li>Prop lever back</li><li>Reduce airspeed</li><li>Land</li></ol></div>
</div>
<h3 id="em-fire">Fire in flight</h3>
<ol>
<li>MAYDAY.</li>
<li>Fuel valve closed. Magnetos, master, generator, ignition off.</li>
<li>Descend. Side-slip to keep the flames away if needed.</li>
<li>Emergency landing.</li>
</ol>
<p>If the fire continues and the landing looks dangerous, abandon the aircraft.</p>
<h3 id="em-gear">Emergency gear extension</h3>
<ol>
<li>Check the main air valve is open and read the main pressure. Normal 40–50; about 10–15 is the minimum to try a normal extension.</li>
<li>If that fails, check emergency pressure (40–50).</li>
<li>Close the main air valve.</li>
<li>Gear levers in <b>both cockpits to neutral</b>.</li>
<li>Slow to 160–180 km/h.</li>
<li>Open the emergency air valve on the right side panel. The gear drops with a bang.</li>
<li>Check three greens and the mechanical indicators.</li>
<li>Gear levers in both cockpits DOWN.</li>
<li>Normal flapless landing.</li>
<li>After shutdown, close the emergency valve.</li>
</ol>
<div class="callout warn">Do not retract the gear in flight after an emergency extension. Emergency air can't start the engine, retract the gear or lower the flaps.</div>
<h3 id="em-bail">Abandoning the aircraft</h3>
<p>Seven reasons the POH gives for using the parachute: no spin recovery; structural failure; jammed controls; mid-air collision; fire; engine failure over unlandable ground; harness or lock failure. The commander decides. Commands: "Get ready to jump!" then "Jump!", or just "Jump!" if out of control.</p>
<div class="cols2">
<div><h4>Straight and level</h4><ol>
<li>Open the canopy (first action in any emergency except fire)</li>
<li>Gain height, lose speed if possible</li>
<li>Disconnect headset if possible</li>
<li>Pull legs in, open the harness</li>
<li>Hands on the canopy rails, lift out of the seat</li>
<li>Feet on the seat, turn to the side</li>
<li>Knee on the rail (left rail to go left), push out head down</li>
</ol></div>
<div><h4>Inverted</h4><ol>
<li>Open the canopy</li>
<li>Gain height, lose speed if possible</li>
<li>Pull legs in, tuck the body</li>
<li>Open the harness and push the stick forward at once</li>
<li>Open the parachute once clear</li>
</ol></div>
</div>
<p>If time allows, close the fuel valve and switch off magnetos, master, generator and ignition first. The <b>front cockpit leaves first</b>. On fire, delay opening by 3–5 s.</p>
<table class="grid"><thead><tr><th>S-4U, straight &amp; level</th><th>Minimum height</th></tr></thead><tbody>
<tr><td>Automatic opening (2 s delay)</td><td class="num">120 m (≈400 ft)</td></tr>
<tr><td>Immediate deployment at 120 km/h</td><td class="num">70 m (≈230 ft)</td></tr>
<tr><td>Immediate deployment at 220 km/h</td><td class="num">60 m (≈200 ft)</td></tr>
</tbody></table>`

  id: "aeros", title: "Aerobatics & spinning", ref: "2.8–2.11, 6.1–6.2",
  summary: "Power, entry speeds, spin entry and recovery, flat spin behaviour and height rules.",
  html: `
<h3 id="aeros-pre">Before aerobatics</h3>
<ul>
<li>At least <b>20 L of fuel</b>. Oil 10 L recommended.</li>
<li>Gear and flaps up. Both canopies locked.</li>
<li>Safe height, not over built-up areas, and a <b>decided minimum height for abandoning</b> the aircraft.</li>
<li>Check-out by a suitably qualified pilot experienced on type in unusual attitudes and spinning before flying aerobatics.</li>
</ul>
<h3 id="aeros-power">Power and entry speeds</h3>
<p>Aerobatics are flown at <b>82 % RPM, manifold pressure maximum</b> unless stated. The Yak-52 can fly every figure in the Aresti catalogue.</p>
<table class="grid"><thead><tr><th>Figure</th><th>Entry km/h</th></tr></thead><tbody>
<tr><td>Loop</td><td class="num">300</td></tr>
<tr><td>½ Cuban eight</td><td class="num">300</td></tr>
<tr><td>Reverse ½ Cuban</td><td class="num">300</td></tr>
<tr><td>Immelmann</td><td class="num">320</td></tr>
<tr><td>Aileron roll</td><td class="num">230</td></tr>
<tr><td>Spin</td><td>82 %, gentle deceleration, throttle to idle</td></tr>
</tbody></table>
<div class="callout warn">The Russian syllabus treats the stall turn and other vertical figures as <b>advanced</b>. Get training in recovery from the vertical and from the flat spin first. A mishandled stall turn is the usual way into an inadvertent flat spin.</div>
<h3 id="aeros-spin">Normal erect spin</h3>
<p><b>Entry:</b> 82 %, level at about 220 km/h, close the throttle and raise the nose about 30° to bleed speed. Passing 120 km/h, return to the level attitude (now about 100–105 km/h). Full rudder in the spin direction (it spins best to the right) and, as the nose yaws, smoothly full back stick.</p>
<div class="callout"><b>Recovery</b>
<ol>
<li>Full opposite rudder.</li>
<li>Stick forward past neutral (between neutral and fully forward).</li>
<li>As rotation stops, centralise both.</li>
<li>At 200 km/h pull out to level, opening the throttle smoothly so it's fully open by level flight.</li>
</ol></div>
<p>Wings level before entry. <b>No aileron in the spin.</b> Throttle fully closed. All spinning at a height that allows recovery by <b>1000 m (3300 ft) AGL</b>, under supervision of a suitably qualified person.</p>
<h3 id="aeros-flat">The flat spin</h3>
<ul>
<li>High rotation rate, large and fast height loss, very high stick forces to recover.</li>
<li>Closing the throttle alone does not recover it.</li>
<li>The heavy engine in front and radio equipment behind the rear seat give a lot of rotational inertia: up to <b>four turns</b> to recover once fully developed.</li>
<li>Recovery can flick into an inverted spin, which is disorientating.</li>
<li>Russian manual figures: rudder force up to 100 kg (220 lb), stick force 40 kg (90 lb). Two hands may be needed on the stick. It can feel jammed.</li>
<li>Some aircraft need <b>in-spin aileron</b> after a fully developed flat spin. Practise only with an instructor in a Yak-52.</li>
<li>Height loss can exceed 2000 ft. Start flat spin practice at <b>6000 ft AGL</b> minimum and initiate recovery by <b>5000 ft AGL</b>.</li>
<li>CG position matters in all aerobatics, especially the flat spin.</li>
</ul>`
},

<h3 id="perf-glide">Glide</h3>

  summary: "Passenger briefing, solo rear-cockpit set-up and safety pilot procedures.",
  html: `
<h3 id="rs-brief">Passenger briefing</h3>
<ul>
<li>Controls and instruments, including the mechanical gear indicators on the wings.</li>
<li>Fit the parachute and show how to release it if leaving the aircraft on the ground.</li>
<li>Fit the harness; show how to tighten and release it.</li>
<li>Show how to open and close the canopy.</li>
<li>Explain how to abandon the aircraft in flight.</li>
<li>Intercom use, and make sure they won't transmit on the radio by mistake.</li>
<li>Agree the nature of the flight. Don't show off or get talked into low flying or aerobatics they aren't ready for.</li>
</ul>
<p>Empty your pockets before getting in.</p>
<h3 id="rs-solo">Rear cockpit for solo flight</h3>
<ul>
<li>No loose articles; headset and parachute out.</li>
<li>Harness fastened and tied together firmly.</li>
<li>Flap lever neutral. Brake release switch off (back).</li>
<li>Front gear lever down and latched, then rear gear lever to neutral (also latched).</li>
<li>Magneto 1+2 (after the pull-through). Ignition switch "1 COCKPIT" (up). Failure imitators off (down).</li>
<li>Parking brake released. Canopy closed and locked.</li>
</ul>
<h3 id="rs-safety">Safety pilot</h3>
<ul>
<li>Get coaching first: the view from the back is different, and rear-seat landings need practice with an experienced pilot in front.</li>
<li>Brief the exercises and, above all, how control passes from front to rear. Don't fly exercises the safety pilot isn't current on.</li>
<li>Leave the rear flap lever at neutral. Work the rear gear lever between down and neutral yourself.</li>
<li>The rear seat has no gill or oil cooler controls, so watch the CHT and oil temperature and make sure the front pilot manages them.</li>
</ul>`

{t:"air",q:"How is the main air valve set before start?",a:"Fully on (anti-clockwise), then a quarter turn back",d:["Fully on (clockwise)","Half open","Closed until after start"],x:"And closed after flight.",r:"4.4.5.1"},

{t:"electrical",q:"Master switch positions?",a:"Up battery on, centre off, down ground power",d:["Up on, down off","Up on, centre ground power, down off","Rotary: off, battery, both"],x:"Leave it in the centre when switching off.",r:"8.5"},

{t:"cockpit",q:"Which controls are in the front cockpit only?",a:"Primer, oil cooler, gills and carb heat",d:["Throttle and prop","Gear and flaps","Magnetos and starter"],x:"So a rear-seat safety pilot must watch the temperatures.",r:"4.2.12"},
{t:"cockpit",q:"Which controls are in the rear cockpit only?",a:"Ignition transfer, failure imitators, brake override",d:["Primer and carb heat","Gills and oil cooler","Gear and flap levers"],x:"Instructor functions.",r:"8.1.3"},
{t:"cockpit",q:"How is the elevator trimmed?",a:"Cockpit-adjustable tab on the left elevator",d:["Tab on the right elevator","Moving tailplane","Spring bias in the control run"],x:"Rudder and aileron tabs are ground-adjustable only.",r:"4.2.8"},

{t:"start",q:"Priming rule of thumb?",a:"1 prime per 10 °C below 100 °C CHT",d:["1 prime per 20 °C below 100 °C","3 primes always","1 prime per 10 °C OAT below 20 °C"],x:"Max 9 primes.",r:"4.3.2"},

{t:"start",q:"CHT 60 °C: how many primes?",a:"4",d:["6","2","3"],x:"(100 − 60) ÷ 10 = 4.",r:"4.4.5.2"},

{t:"start",q:"Maximum continuous press of the starter button?",a:"15 seconds",d:["5 seconds","30 seconds","60 seconds"],x:"Normally starts in 3–5 s.",r:"4.4.5.3"},

{t:"start",q:"Oil pressure requirement after start?",a:"≥1 kg/cm² within 15–20 s",d:["≥4 kg/cm² within 30 s","≥1 kg/cm² within 60 s","≥0.5 kg/cm² within 10 s"],x:"Otherwise shut down immediately.",r:"4.4.5.4"},

{t:"emergencies",q:"Engine failure after take-off: actions in order",a:"<ol><li>Stick forward, 160 km/h</li><li>Gear UP</li><li>Field ahead (no turn-back)</li><li>MAYDAY</li><li>Fuel stop-valve closed</li><li>Mags, master, gen, ignition off</li><li>Canopy open</li><li>Flaps when appropriate</li></ol>",r:"3.2.1.1"},

{t:"emergencies",q:"Engine failure inverted: restart",a:"<ol><li>Half-roll erect</li><li>Descend 170–180 km/h</li><li>Throttle ⅓</li><li>Primer left, pump to 0.1–0.2 (prime cylinders right if possible)</li><li>Fires: full throttle in 1–2 s, then set</li></ol><p>Expect 1200–1500 ft loss.</p>",r:"3.2.1.2"},
{t:"emergencies",q:"Emergency gear extension: sequence",a:"<ol><li>Main air valve open? Main ≥10–15 to try normal</li><li>Emergency air 40–50</li><li>Main air valve closed</li><li>Both gear levers neutral</li><li>160–180 km/h</li><li>Emergency valve (right panel) open</li><li>3 greens + mechanical</li><li>Both levers DOWN</li><li>Flapless landing, don't retract</li><li>Close emergency valve after shutdown</li></ol>",r:"3.2.7"},

{t:"emergencies",q:"Abandoning in straight and level flight",a:"<ol><li>Canopy open</li><li>Height up, speed down</li><li>Headset off</li><li>Legs in, harness open</li><li>Hands on rails, lift out, feet on seat</li><li>Turn sideways, knee on rail, out head down</li></ol>",r:"3.2.8.1"},
{t:"emergencies",q:"Abandoning inverted",a:"<ol><li>Canopy open</li><li>Height up, speed down</li><li>Legs in, tuck</li><li>Harness open, stick forward at once</li><li>Open the chute when clear</li></ol>",r:"3.2.8.2"},
{t:"emergencies",q:"Oil pressure falling: decision",a:"<p>Oil temperature <b>rising</b>: land now at the nearest field, or forced landing gear up.</p><p>Oil temperature <b>steady</b>: monitor, nearest airfield, precautionary landing ASAP.</p>",r:"3.2.2"},
